<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CSS Box</title>
    <style>
        *{
            margin: 0;
            padding:0;
        }
        .box{
            background-color: aqua;
        }
        .box1{
            color: blueviolet;
            padding:10px;
            margin: 25px;
            border: 2px solid brown;
            height: 100px;
            box-sizing: border-box;
        }
        .box2{
            color: rgb(30, 30, 6);
            padding:10px;
            margin: 25px;
            border: 2px solid rgb(23, 12, 12);
            height: 100px;
            box-sizing: border-box;
        }
    </style>
</head>
<body>
    <div class="box box1">i am box 1</div>
    <div class="box box2">i am box 2</div>
</body>
</html>
