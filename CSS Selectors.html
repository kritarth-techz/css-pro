<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title> CSS selectors</title>
    <style>
        /* Element selectors */
         div{
            background-color: red;
         }
         /* class selector */
         .red{
            background-color:red ;
         }
         /* id slector */
         #green{
            background-color: aqua;
         }
         /* child selectors */
         div > p {
            background-color: aqua;
            color: rgb(41, 5, 75);
         }
         /* desendent selectors */
         div p{
            background-color: rgb(1, 55, 55);
            color: rgb(194, 158, 228);
         }
         /* universal selector */
         *{
            margin: 0;
            padding: 0;
         }
         /* pseudo selector */
         a:visited{
            color: rgb(227, 227, 12);
         }
         a:link{
            color: green; 
         }
         a:active{
            background-color: red;
         }
         a:hover{
            background-color: palevioletred;
         }
         p:first-child{
            background-color: pink;
         }

    </style>
</head>
<body>
    <main>
        <p>i am one</p>
        <p>i am a second</p>
    </main>
    <div class="red">
         i am a div
        </div>
        <div id="green">
             i ama another div 
             
             <p>i am inside para in the div</p>
             <p>i am inside para 2 in the div</p>
        </div>
        <a href="htths://www.google3.com">Google2</a>
        <br>
        <a href="https://www.facebook.com">Facebook</a>
</body>
</html>
