<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css display property</title>
    <style>
        *{
            margin: 0;
            padding: 0;
        }
        .box{
            border: 2px solid blue;
            display: inline-block;
            padding: 34px;
        }
    </style>
</head>
<body>
    <div class="box">
        i am box 
    </div>
    <div class="box">boy </div>
    <span>i am good boy</span>
    <span>boy</span>
    <div>i am nice boy</div>
    <span>boy
    </span>
</body>
</html>
