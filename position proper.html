<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0px;
            padding: 0px;
            
        }
        .parent{
            /* EXCEPTION: transfer, filter,or perspective properties can also make an element appear as positioned */
            margin: 20px;
            padding: 40px;
            border: 2px solid black;
            background-color: aliceblue;
            overflow: scroll;
        }
        .box1{
            background-color: blueviolet;
             position: sticky;
            top: 0px;
            margin: 0px;
            padding: 100%;
        }
        .box2{
            background-color: blanchedalmond;
            position: relative;
            top: 34px;
            left: 56px;
        }
        .box3{
            background-color: aquamarine;
            
        }
        .box4{
            background-color: rgb(107, 82, 206);
        }
        .box{
            height: 133px;
            width: 80vw;
            margin: 3px;
            padding: 3px;
            border: 2px solid black;

        }
    </style>
</head>
<body>
    <div class="parent">
    <div class="box box1"></div>
    <div class="box box2"></div>
    <div class="box box3"></div>
    <div class="box box4"></div>
    </div>
</body>
</html>
