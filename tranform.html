<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            height: 50px;
            width: 50px;
            background-color: beige;
            border: 2px solid black;
            /* transform: rotateX(45deg); */
            /* transform:skewX(5deg); */
            transform:translateY(100%) skewX(45deg) translateX(45%);
            justify-content: center;
            display:flex;
            align-items: center;

        }
        .container{
            width: 100vw;
            height: 100vh;
            border: 2px solid purple;


        }
    </style>
</head>
<body>
    <div class="container">
        <div class="box">
            box
        </div>
    </div>
</body>
</html>
