<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>css shadows</title>
    <style>
        .box{
            border: 2px solid black;
            margin: 0;
            padding: 0;
            box-shadow: 5px 5px 15px #bd2727;
        }
        .text-element{ text-shadow: 2px 2px 4px #e21212;
        }
    </style>
</head>
<body>
    <div class="box">
        i  am box
    </div>
    <p class="text-element">
        Lorem ipsum dolor sit amet consectetur adipisicing elit. Inventore qui, necessitatibus ea dolorum alias adipisci suscipit hic aperiam in laborum similique, impedit ab ex temporibus, eum debitis ad deserunt?
    </p>
</body>
</html>
