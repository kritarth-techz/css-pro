<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SIZING</title>
    <style>
        * {
            margin: 0;
            padding: 0;
        }

        html{
            font-size: 12px;
        }
        .box {
            border: 2px solid red;
            /* width: 2040px; */
            width: 8s0vw;
            height: 80%;
            margin: 23px ;
            background-color: aqua;

        }

        .container {
            box-sizing: border-box;
            border: 2px solid black;
            width: 80vw;
            margin: 23px auto;
            font-size: 18px;
            min-height: 80vh;
        }
        .container p{
    
            font-size:2em;
        }
        .mycount{
            box-sizing:border-box ;      
            background-color: aquamarine;
            border: 2px solid black;
            color: red;
            width: 100vmin;

        }
    </style>
</head>

<body>
    <div class="box">
        This my box
    </div>
    <div class="container">
        <p>
            Lorem ipsum dolor sit amet consectetur, adipisicing elit. Velit facilis ratione harum recusandae. Cum qui debitis sapiente praesentium temporibus porro, voluptas consectetur ab quas, dolore cupiditate obcaecati placeat quibusdam expedita?
        </p>
       
    </div>
    <div class="mycount">
        i am another container
    </div>
</body>

</html>
